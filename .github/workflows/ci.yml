name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Install locked worker dependencies
        run: python -m pip install -r requirements-worker.lock --target .worker-deps
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Static typing
        run: PYTHONPATH=.worker-deps mypy app worker docguard_contract
      - name: Tests
        run: PYTHONPATH=.worker-deps pytest
