[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docguard"
version = "1.1.1"
description = "An isolated and explainable security gateway for untrusted business documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi==25.1.0",
  "fastapi>=0.115,<1",
  "Jinja2==3.1.6",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
worker = [
  "defusedxml==0.7.1",
  "olefile==0.47",
  "oletools==0.60.2",
  "pikepdf==10.11.0",
  "PyMuPDF==1.28.2",
  "yara-python==4.5.4",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "docguard_contract*", "worker*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "worker", "docguard_contract"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["defusedxml.*", "olefile", "oletools.*", "pymupdf", "yara"]
ignore_missing_imports = true
